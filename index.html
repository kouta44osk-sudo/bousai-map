<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>100日後の大災害 - 防災マップ</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
        }
        #map {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1;
        }
        .gps-button {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 1000;
            background: #ffffff;
            color: #333333;
            padding: 12px 18px;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            border: none;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <button class="gps-button" onclick="trackLocation()">現在地にジャンプ</button>

    <script src="https://unpkg.com"></script>
    <script>
        const map = L.map('map', {
            zoomControl: true
        }).setView([34.606822, 135.571434], 14);

        L.tileLayer('https://gsi.go.jp{z}/{x}/{y}.png', {
            minZoom: 2,
            maxZoom: 18,
            attribution: '国土地理院'
        }).addTo(map);

        L.tileLayer('https://gsi.go.jp{z}/{x}/{y}.png', {
            opacity: 0.6,
            minZoom: 2,
            maxZoom: 17
        }).addTo(map);

        let currentMarker = null;
        let currentCircle = null;

        function trackLocation() {
            if (!navigator.geolocation) {
                alert("お使いの端末はGPSに対応していません");
                return;
            }

            navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    if (currentMarker) {
                        map.removeLayer(currentMarker);
                        map.removeLayer(currentCircle);
                    }

                    currentMarker = L.circleMarker([lat, lng], {
                        radius: 9,
                        color: '#ffffff',
                        weight: 2,
                        fillColor: '#007AFF',
                        fillOpacity: 0.9
                    }).addTo(map).bindPopup("あなたの現在地");

                    currentCircle = L.circle([lat, lng], {
                        radius: accuracy,
                        color: '#007AFF',
                        weight: 1,
                        fillColor: '#007AFF',
                        fillOpacity: 0.15
                    }).addTo(map);

                    map.setView([lat, lng]);
                },
                (error) => {
                    console.log("位置情報の取得に失敗しました。");
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        window.onload = trackLocation;
    </script>
</body>
</html>
