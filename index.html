<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>100日後に大災害が起こるんです</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>#map { height: 100vh; }</style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // 1. 地図の初期化（大阪市平野区長吉周辺）
    const map = L.map('map', {
        zoomControl: true
    }).setView([34.606822, 135.571434], 14);

    // 地理院地図（標準）
    L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
      attribution: '地理院地図',
      maxZoom: 18,
      minZoom: 5
    }).addTo(map);

    // 洪水浸水想定タイル（想定最大規模 L2）
    L.tileLayer('https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin/{z}/{x}/{y}.png', {
      attribution: '国土交通省 洪水浸水想定区域図',
      opacity: 0.6,
      transparent: true
    }).addTo(map);
    
 // 4. GPSで現在地を「監視・更新」し続ける関数
    function trackLocation() {
        if (!navigator.geolocation) {
            alert("お使いの端末はGPSに対応していません");
            return;
        }

        // getCurrentPositionではなく、watchPositionに変えることで電波を掴むまで探し続けます
        navigator.geolocation.watchPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                // すでにマーカーがあれば一旦消す
                if (currentMarker) {
                    map.removeLayer(currentMarker);
                    map.removeLayer(currentCircle);
                }

                // 外部画像を使わず、青いレーザーポイントを強制描画
                currentMarker = L.circleMarker([lat, lng], {
                    radius: 10,
                    color: '#ffffff',
                    weight: 3,
                    fillColor: '#007AFF',
                    fillOpacity: 1.0
                }).addTo(map).bindPopup("あなたの現在地");

                // 誤差の範囲を表示
                currentCircle = L.circle([lat, lng], {
                    radius: accuracy,
                    color: '#007AFF',
                    weight: 1,
                    fillColor: '#007AFF',
                    fillOpacity: 0.1
                }).addTo(map);

                // ★最重要：位置情報が取れた瞬間、あなたの今いる場所に画面を自動で強制移動させる
                if (!hasCentered) {
                    map.setView([lat, lng], 16);
                    hasCentered = true; // 何度も勝手に画面が動かないように固定
                }
            },
            (error) => {
                console.log("GPS受信中... 電波を探しています。");
            },
            {
                enableHighAccuracy: true, // 高精度GPSを使用
                timeout: 15000,           // 15秒間探し続ける
                maximumAge: 0
            }
        );
    }

    // 画面が開いた瞬間に自動でGPSを起動する
    window.onload = trackLocation;
</script>
</body>
</html>
