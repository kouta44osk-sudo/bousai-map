<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>洪水浸水想定タイル重ね地図</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>#map { height: 100vh; }</style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([35.6812, 139.7671], 14); // 東京駅

    // 地理院地図（標準）
    L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
      attribution: '地理院地図',
      maxZoom: 18,
      minZoom: 5
    }).addTo(map);

    // 洪水浸水想定タイル（想定最大規模 L2）
    L.tileLayer('https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin/{z}/{x}/{y}.png', {
      attribution: '国土交通省 洪水浸水想定区域図',
      opacity: 0.6,
      transparent: true
    }).addTo(map);
  </script>
</body>
</html>
