<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>100日後に大災害が起こるんです</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    /* 現在地にジャンプするボタン */
    .gps-button {
      position: absolute;
      bottom: 30px;
      right: 20px;
      z-index: 9999;

      background: #ffffff;
      color: #333333;

      padding: 12px 18px;
      border-radius: 25px;

      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);

      cursor: pointer;
      font-weight: bold;
      font-size: 14px;

      border: none;
    }

    .gps-button:hover {
      background: #f0f0f0;
    }

    .gps-button:active {
      transform: scale(0.96);
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <!-- 現在地にジャンプするボタン -->
  <button
    class="gps-button"
    onclick="jumpToCurrentLocation()">
    現在地にジャンプ
  </button>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>

    // =====================================
    // 1. 地図の初期化
    // =====================================

    const map = L.map('map', {
      zoomControl: true
    }).setView([34.606822, 135.571434], 14);


    // =====================================
    // 2. 国土地理院 標準地図
    // =====================================

    L.tileLayer(
      'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
      {
        attribution: '地理院地図',
        maxZoom: 18,
        minZoom: 5
      }
    ).addTo(map);


    // =====================================
    // 3. 洪水浸水想定区域
    // =====================================

    L.tileLayer(
      'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin/{z}/{x}/{y}.png',
      {
        attribution: '国土交通省 洪水浸水想定区域図',
        opacity: 0.6
      }
    ).addTo(map);


    // =====================================
    // 4. 現在地用の変数
    // =====================================

    let locationMarker = null;
    let accuracyCircle = null;

    // 最新の現在地を保存
    let currentLatLng = null;
    let currentAccuracy = null;


    // =====================================
    // 5. 現在地を取得
    // =====================================

    if (navigator.geolocation) {

      navigator.geolocation.watchPosition(

        // ---------------------------------
        // 現在地取得成功
        // ---------------------------------

        (position) => {

          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          const latLng = [lat, lng];

          // 最新の現在地を保存
          currentLatLng = latLng;
          currentAccuracy = accuracy;


          // -------------------------------
          // 初回はマーカーを作成
          // -------------------------------

          if (!locationMarker) {

            locationMarker = L.circleMarker(latLng, {
              radius: 8,
              color: '#ffffff',
              fillColor: '#2a81cb',
              fillOpacity: 1,
              weight: 2
            }).addTo(map);

          } else {

            // 2回目以降は位置だけ更新
            locationMarker.setLatLng(latLng);

          }


          // -------------------------------
          // 精度円
          // -------------------------------

          if (!accuracyCircle) {

            accuracyCircle = L.circle(latLng, {
              radius: accuracy,
              color: '#136fad',
              fillColor: '#136fad',
              fillOpacity: 0.15,
              weight: 1
            }).addTo(map);

          } else {

            accuracyCircle.setLatLng(latLng);
            accuracyCircle.setRadius(accuracy);

          }


          // -------------------------------
          // ポップアップを更新
          // -------------------------------

          locationMarker.bindPopup(
            "現在地はこちらです<br>" +
            "位置精度：約" +
            Math.round(accuracy) +
            "m"
          );

        },


        // ---------------------------------
        // 現在地取得失敗
        // ---------------------------------

        (error) => {

          console.error(error);

          alert(
            "位置情報の取得に失敗しました。\n\n" +
            "エラー：" +
            error.message
          );

        },


        // ---------------------------------
        // 位置情報取得設定
        // ---------------------------------

        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 10000
        }

      );

    } else {

      alert(
        "お使いのブラウザは位置情報取得に対応していません。"
      );

    }


    // =====================================
    // 6. 現在地にジャンプ
    // =====================================

    function jumpToCurrentLocation() {

      if (!currentLatLng) {

        alert(
          "まだ現在地を取得できていません。\n" +
          "位置情報の取得を許可して、少し待ってください。"
        );

        return;
      }

      // 現在地へ移動
      map.setView(currentLatLng, 16, {
        animate: true
      });

      // ポップアップを表示
      if (locationMarker) {
        locationMarker.openPopup();
      }

    }

  </script>

</body>
</html>
